name: Deploy Website

# Manual only in this fork: the site is the upstream project's.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: website

      - name: Type check
        run: npx astro check
        working-directory: website

      - name: Build Astro
        run: npx astro build
        env:
          # Read-only use: the build fetches the repo's star count for the navbar.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
