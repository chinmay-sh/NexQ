name: Build Windows installer

# Manual build of any branch: Actions → "Build Windows installer" → Run workflow.
# Unsigned and without updater artifacts, so it needs no secrets; the NSIS
# installer is attached to the run as an artifact. Tests: run the CI workflow
# on the same branch (it also has a Run workflow button).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Same cache key scheme as release.yml (see the comment there).
      - name: MSVC toolset version
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          if (-not $version) { throw "MSVC toolset version not found under $vs" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable
          key: msvc-${{ steps.msvc.outputs.version }}

      - name: Install dependencies
        run: npm ci

      # tauri.windows.conf.json turns on signed updater artifacts, which need the
      # upstream maintainer's private key (a merged --config/TAURI_CONFIG did not
      # override it). This personal build makes none, and its updater checks this
      # repository's releases, so it never offers to replace itself with upstream's.
      - name: Turn off updater signing
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const edit = (file, change) => {
              const config = JSON.parse(fs.readFileSync(file, "utf8"));
              change(config);
              fs.writeFileSync(file, JSON.stringify(config, null, 2));
            };
            edit("src-tauri/tauri.windows.conf.json", (c) => { c.bundle.createUpdaterArtifacts = false; });
            edit("src-tauri/tauri.conf.json", (c) => {
              c.bundle.createUpdaterArtifacts = false;
              c.plugins.updater.endpoints = [`https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`];
            });
          '
          grep -n "createUpdaterArtifacts\|releases/latest" src-tauri/tauri.conf.json src-tauri/tauri.windows.conf.json

      - name: Build installer
        run: npm run tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NexQ-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
