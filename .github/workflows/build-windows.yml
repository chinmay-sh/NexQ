name: Build Windows installer

# Manual build of any branch: Actions → "Build Windows installer" → Run workflow.
# Unsigned and without updater artifacts, so it needs no secrets; the NSIS
# installer is attached to the run as an artifact. Tests: run the CI workflow
# on the same branch (it also has a Run workflow button).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # Same cache key scheme as release.yml (see the comment there).
      - name: MSVC toolset version
        id: msvc
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $version = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt" -Raw).Trim()
          if (-not $version) { throw "MSVC toolset version not found under $vs" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: v1-ggml-portable
          key: msvc-${{ steps.msvc.outputs.version }}

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run tauri build
        env:
          # tauri.windows.conf.json turns on signed updater artifacts, which need
          # the upstream maintainer's private key. This build makes none, and its
          # updater looks at this repository's releases instead of upstream's, so
          # it never offers to replace itself with an upstream release.
          TAURI_CONFIG: '{"bundle":{"createUpdaterArtifacts":false},"plugins":{"updater":{"endpoints":["https://github.com/${{ github.repository }}/releases/latest/download/latest.json"]}}}'

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: NexQ-windows-${{ github.sha }}
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
